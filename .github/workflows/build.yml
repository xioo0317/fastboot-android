name: Build fastboot (Android static)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: fastboot-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: r27c
  NDK_HOME: ${{ github.workspace }}/android-ndk

jobs:
  # 免 root fd 传递协议互通：host 侧真实 SCM_RIGHTS 回环，先于 NDK 构建给出结论
  fdpass-interop:
    name: fdpass interop (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译并运行接收端互通测试
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            -I fdpass \
            tests/fdpass_interop_test.c fdpass/fdpass_recv.c \
            -o /tmp/fdpass_interop_test
          /tmp/fdpass_interop_test

  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
          - abi: armeabi-v7a
            arch: arm
          - abi: x86_64
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      # flex  -> libsepol 的 cil_lexer.l
      # golang -> boringssl 的构建脚本
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build flex bison golang-go file

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: android-ndk
          key: ndk-${{ env.NDK_VERSION }}

      - name: Download Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip
          mv "android-ndk-${NDK_VERSION}" android-ndk
          rm -f /tmp/ndk.zip

      - name: Build
        run: ./build.sh --arch ${{ matrix.arch }} --ndk "$NDK_HOME" --jobs 2

      - name: Verify
        run: |
          OUT="build/ndk-static-${{ matrix.abi }}/fastboot"
          file "$OUT"
          # 静态可执行文件不应依赖任何共享库
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$OUT" || true
          mkdir -p dist
          cp "$OUT" "dist/fastboot-${{ matrix.abi }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastboot-${{ matrix.abi }}
          path: dist/fastboot-${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 30
